[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-harness"
version = "0.1.0"
description = "Autonomous, read-only business and customer intelligence using CRISP-DM"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.2,<6"]
dev = ["ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
ds-harness = "ds_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_harness"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
