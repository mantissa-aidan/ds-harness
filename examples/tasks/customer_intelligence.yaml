name: customer_intelligence
objective: Understand customer value, purchase behavior, and evidence for a retention experiment.
decision: Prioritize customer research and a controlled retention experiment.
success_criteria:
  - Revenue definitions, grain and reporting currency are agreed with the business owner.
  - Customer segments are interpretable and predictive performance exceeds a naive baseline.
datasets: [customers, orders]
as_of: '2026-10-01'
hypotheses:
  - Inactivity and support interactions may be associated with subsequent churn.
constraints:
  - Read-only access; no campaign execution or external writes.
feature_allowlist:
  customers: [tenure_months, monthly_value, days_since_login, support_tickets, region]
analyses:
  - id: revenue_by_channel
    kind: kpi
    dataset: orders
    group_by: [channel]
    measures: [amount]
  - id: customer_segments
    kind: rfm
    dataset: orders
    customer_id: customer_id
    date_column: order_date
    amount_column: amount
    transaction_id: order_id
  - id: churn_baseline
    kind: classification
    dataset: customers
    target: churned
    features: [tenure_months, monthly_value, days_since_login, support_tickets, region]
    split: random
    min_improvement: 0.05
